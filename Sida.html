<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🎰 عجلة الحظ</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b0014;
  font-family:Arial;
  color:#fff;
}
.box{text-align:center}

/* السهم */
.pointer{
  width:0;height:0;
  margin:auto;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:30px solid gold;
  filter:drop-shadow(0 0 8px gold);
}

/* الحاوية */
.wheel-wrap{
  position:relative;
  width:260px;
  height:260px;
  margin:12px auto;
}

/* الحلقة الخارجية */
.outer-ring{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      #ffd700 0deg 6deg,
      #3b2a00 6deg 12deg
    );
  box-shadow:
    0 0 20px #ffd700,
    inset 0 0 30px #000;
}

/* العجلة */
.wheel{
  position:absolute;
  inset:8px;
  border-radius:50%;
  background:
    conic-gradient(
      #8b0000 0deg 45deg,
      #004466 45deg 90deg,
      #8b7500 90deg 135deg,
      #2b145f 135deg 180deg,
      #8b0000 180deg 225deg,
      #004466 225deg 270deg,
      #8b7500 270deg 315deg,
      #2b145f 315deg 360deg
    );
  box-shadow:
    inset 0 0 25px rgba(0,0,0,.9),
    0 10px 30px rgba(0,0,0,.9);
  transition:transform 4s cubic-bezier(.15,.9,.2,1);
}

/* مركز العجلة */
.center{
  position:absolute;
  top:50%;
  left:50%;
  width:55px;
  height:55px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,#ffd700,#8b6500);
  box-shadow:inset 0 0 10px #fff,0 0 15px #ffd700;
}

.number{
  position:absolute;
  top:45%;
  left:45%;
  width:30px;
  text-align:center;
  font-size:19px;
  font-weight:bold;
  color:#fff;
  text-shadow:0 0 6px #100;
  transform-origin:20% 10%;
}

input,button{
  width:200px;
  height:36px;
  border:none;
  border-radius:20px;
  margin-top:6px;
  text-align:center;
}
button{
  background:#00ffd5;
  font-size:15px;
  cursor:pointer;
}

#result{margin-top:10px;font-size:20px;color:#ffd700}
#balance{margin-top:6px;color:#00ffd5}
</style>
</head>

<body>

<div class="box">
  <div class="pointer"></div>

  <div class="wheel-wrap">
    <div class="outer-ring"></div>
    <div class="wheel" id="wheel">
      <div class="center"></div>
    </div>
  </div>

  <input id="codeInput" placeholder="🎫 أدخل الرمز">
  <button onclick="checkCode()">✔ تأكيد الرمز</button>
  <button onclick="spin()">🎯 لف العجلة</button>

  <div id="result"></div>
  <div id="balance"></div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, updateDoc,
  increment, serverTimestamp
} from
"https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* Firebase */
const app = initializeApp({
  apiKey: "AIzaSyAa6ETi1DmEI-3nVuqjpsaodT0rXsP8bIw",
  authDomain: "aple-21978.firebaseapp.com",
  projectId: "aple-21978"
});
const db = getFirestore(app);

/* الجوائز */
const prizes = [0,10000,1500,3500,0,5000,500,4000];
const wheel = document.getElementById("wheel");

let angle=0;
let canSpin=false;
let codeRef=null;

/* إنشاء الأرقام بشكل منظم */
prizes.forEach((p,i)=>{
  const n = document.createElement("div");
  n.className = "number";
  n.innerText = p;

  const step = 360 / prizes.length;
  const angle = i * step + step / 2;

  /* 
    rotate(angle) -> نحدد القطاع
    translateY(-85px) -> نطلع الرقم للفوق داخل المثلث
    rotate(-angle) -> نرجع الرقم واقف مستقيم
  */
  n.style.transform =
    `rotate(${angle}deg) translateY(-85px) rotate(${-angle}deg)`;

  wheel.appendChild(n);
});

/* تأكيد الرمز */
window.checkCode = async ()=>{
  const code = codeInput.value.trim();
  if(!code){alert("أدخل الرمز");return;}

  codeRef = doc(db,"wheel_codes",code);
  const snap = await getDoc(codeRef);

  if(!snap.exists()){alert("رمز غير صحيح");return;}
  if(snap.data().used){alert("الرمز مستعمل");return;}

  await updateDoc(codeRef,{ used:true });
  canSpin=true;
  alert("✅ رمز صحيح");
};

/* لف العجلة */
window.spin = ()=>{
  if(!canSpin){alert("أكد الرمز أولا");return;}
  canSpin=false;

  angle += 1440 + Math.random()*360;
  wheel.style.transform=`rotate(${angle}deg)`;

  setTimeout(showResult,4100);
};

/* النتيجة + Firebase */
async function showResult(){
  const slice=360/prizes.length;
  const i=Math.floor(((360-(angle%360)+270)%360)/slice);
  const win=prizes[i];

  result.innerText = win ? "🎯 ربحت "+win+" دج" : "❌ خسرت";

  if(win>0){
    await updateDoc(codeRef,{
      balance: increment(win),
      lastWin: win,
      lastSpin: serverTimestamp()
    });
  }

  const s = await getDoc(codeRef);
  balance.innerText =
    "💰 رصيدك: " + (s.data().balance || 0) + " دج";
}
</script>

</body>
</html>
